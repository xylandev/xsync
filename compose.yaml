services:
  xsync-server:
    image: ${XSYNC_IMAGE:-xsync-server:local}
    build:
      context: .
      args:
        VERSION: ${XSYNC_VERSION:-dev}
        COMMIT: ${XSYNC_COMMIT:-unknown}
        BUILD_DATE: ${XSYNC_BUILD_DATE:-unknown}
    restart: unless-stopped
    user: "${XSYNC_UID:-65532}:${XSYNC_GID:-65532}"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - type: bind
        source: ${XSYNC_CONFIG_DIR:?set XSYNC_CONFIG_DIR to a persistent host directory}
        target: /etc/xsync
      - type: bind
        source: ${XSYNC_DATA_DIR:?set XSYNC_DATA_DIR to the mounted data disk}
        target: /data
    # Host and container ports must be identical: the server advertises its
    # own ports in connection bundles and in FTP passive replies. To change a
    # port, change the listen address in config.yaml and both sides here.
    ports:
      - "2022:2022"
      - "2121:2121"
      - "30000-30100:30000-30100"
      - "9000:9000"
      - "9443:9443"
      # Metrics and the admin API stay on the host's loopback interface.
      - "127.0.0.1:9090:9090"
    # shutdown_grace (40s) plus a margin for the final abort.
    stop_grace_period: 50s
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
